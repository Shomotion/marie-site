<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Annemarie Schubert</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="page-inner contact-page">

<div class="hero-fixed">
  <div class="hero-bg"></div>
</div>

<div class="page">

  <header class="nav">
    <a href="index.html" class="logo" aria-label="Home">
<img src="assets/logo.png" alt="Annemarie Schubert" width="30" height="30">
</a>

    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="biography.html">Biography</a>
      <a href="events.html">Events</a>
      <a href="media.html">Media</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>

    <div class="socials">
      <a href="#" aria-label="Facebook">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12Z"/></svg>
      </a>
      <a href="#" aria-label="Instagram">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="0.6" fill="currentColor" stroke="none"/></svg>
      </a>
    </div>

    <!-- Mobile only — replaces .socials at the 820px breakpoint (see
         styles.css). Toggles #mobile-menu below via nav.js. -->
    <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">
      <svg class="nav-toggle-icon-menu" width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 6h18M2 11h18M2 16h18" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <svg class="nav-toggle-icon-close" width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg" hidden>
        <path d="M4 4l14 14M18 4L4 18" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </button>

    <!-- Mobile only — collapsed (max-height:0) until nav.js adds .is-open. -->
    <nav class="mobile-menu" id="mobile-menu" aria-label="Mobile">
      <ul class="mobile-menu-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="biography.html">Biography</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="media.html">Media</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- No .hero-spacer / .content-gradient / .hero-text on inner pages — content
       sits directly over the fixed photo from right under the nav, all the way
       down to the footer. The photo stays fixed and visible the entire scroll;
       .content is transparent (see .content-overlay in styles.css). -->
  <main class="content content-overlay">

    <section class="section page-lead">
      <span class="eyebrow">Contact</span>
      <h2>Get in touch</h2>
    </section>

    <section class="section">
      <!-- EDIT ME: replace YOUR_FORM_ID with your own Formspree form ID
           (or swap the whole action/method for a different form backend
           — see the note in contact-form.js). -->
      <form class="contact-form" id="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
        <div class="form-row">
          <div class="form-field">
            <label for="first-name">First name</label>
            <input type="text" id="first-name" name="firstName" autocomplete="given-name" required>
          </div>
          <div class="form-field">
            <label for="last-name">Last name</label>
            <input type="text" id="last-name" name="lastName" autocomplete="family-name" required>
          </div>
        </div>

        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>

        <div class="form-field">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" required>
        </div>

        <div class="form-field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" required></textarea>
        </div>

        <!-- Honeypot — invisible to real visitors; if a bot fills this
             in, Formspree silently discards the submission. -->
        <input type="text" name="_gotcha" class="form-honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">

        <button type="submit" class="btn">Send Message</button>

        <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <footer class="footer">
      <p>&copy; 2026 Annemarie Schubert. All rights reserved.</p>
    </footer>

  </main>

</div>

<script src="script.js"></script>
<script src="nav.js"></script>
<script src="contact-form.js"></script>
</body>
</html>
