<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media — Annemarie Schubert</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>

<!-- Unlike every other inner page, Media has no fixed background photo —
     it's a plain black page (body's default background) that scrolls
     normally. The carousel itself is the visual interest, so there's no
     .hero-fixed/.hero-bg layer here at all. -->
<div class="page">

<header class="nav">
<a href="index.html" class="logo" aria-label="Home">
<img src="assets/logo.png" alt="Annemarie Schubert" width="30" height="30">
</a>

<nav class="nav-links">
<a href="index.html">Home</a>
<a href="biography.html">Biography</a>
<a href="events.html">Events</a>
<a href="media.html" class="active">Media</a>
<a href="contact.html">Contact</a>
</nav>

<div class="socials">
<a href="#" aria-label="Facebook">
<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12Z"/></svg>
</a>
<a href="#" aria-label="Instagram">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="0.6" fill="currentColor" stroke="none"/></svg>
</a>
</div>

<!-- Mobile only — replaces .socials at the 820px breakpoint (see
     styles.css). Toggles #mobile-menu below via nav.js. -->
<button type="button" class="nav-toggle" id="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">
<svg class="nav-toggle-icon-menu" width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M2 6h18M2 11h18M2 16h18" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
</svg>
<svg class="nav-toggle-icon-close" width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg" hidden>
<path d="M4 4l14 14M18 4L4 18" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
</svg>
</button>

<!-- Mobile only — collapsed (max-height:0) until nav.js adds .is-open. -->
<nav class="mobile-menu" id="mobile-menu" aria-label="Mobile">
<ul class="mobile-menu-links">
<li><a href="index.html">Home</a></li>
<li><a href="biography.html">Biography</a></li>
<li><a href="events.html">Events</a></li>
<li><a href="media.html" class="active">Media</a></li>
<li><a href="contact.html">Contact</a></li>
</ul>
</nav>
</header>

<main class="content">

<!-- Full-bleed carousel with "Media" overlaid on top, like a hero title
     — but what's behind it keeps dissolving between photos instead of
     being one static image. Populated at runtime by carousel.js; edit
     CAROUSEL_IMAGES there to match your filenames in /carousel. -->
<div class="media-hero">
<div class="carousel" id="media-carousel"></div>
<div class="media-hero-scrim"></div>
<h1 class="media-hero-title">Media</h1>
</div>

<section class="section section-wide media-videos">
<!-- Swap the src on each iframe below for your real YouTube video IDs. -->
<div class="video-grid">
<div class="video-embed">
<iframe src="https://www.youtube-nocookie.com/embed/VaqiXiKpVtM" title="Recording 1" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
</div>
<div class="video-embed">
<iframe src="https://www.youtube-nocookie.com/embed/ELW8U6hffNE" title="Recording 2" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>

</div>
<div class="video-embed">
<iframe src="https://www.youtube-nocookie.com/embed/tzFEPCHKcxc" title="Recording 4" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>

</div>
</section>

<script src="script.js"></script>

</body>
</html>
